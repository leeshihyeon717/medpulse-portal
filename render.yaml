services:
  - type: web
    name: medpulse-portal
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python3 server.py"
    envVars:
      # Set these in the Render dashboard (Environment tab) after creating a free database
      # at turso.tech - leaving them unset falls back to a local SQLite file that resets on
      # every restart/redeploy. sync: false means Render will prompt for the value instead
      # of it ever being committed to this repo.
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
